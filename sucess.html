	<title>Фармлайн - Волга</title>
	<style>
		body {
			background: linear-gradient(rgba(232, 129, 131, .8), rgba(139, 255, 195, .8)), url(successBg.jpg) no-repeat;
			background-size: cover;
			height: 100vh;
			display: flex;
			-ms-align-items: center;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			overflow: hidden;
		}

		p {
			font-size: 24px;
			color: white;
			font-family: Arial;
		}

		h2 {
			font-size: 24px;
			color: white;
			text-transform: uppercase;
			font-family: Arial;
		}

		.card {
			padding: 10px;
			width: 50vw;
			height: 200px;
			background: white;
			border: 2px solid #f38181;
			border-radius: 5px;
			display: flex;
			-ms-align-items: center;
			align-items: center;
			justify-content: space-between;
		}

		.card img {
			width: 100px;
			height: 100px;
		}

		.card p {
			color: black;
			text-align: right;
			font-size: 16px;
			font-family: sans-serif;
		}

	</style>
</head>

<body>
	<h2>Спасибо</h2>
	<div class="card">
		<img src="../img/logo.svg">
		<p>Ваше письмо отправлено, в скором времени вам ответят!</p>
	</div>
	<p>Можете закрыть эту вкладку</p>
